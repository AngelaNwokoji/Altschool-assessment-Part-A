name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href=/Altschool-assessment-Part-A/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/AltSchool-Assessment/browser
      - id: deployment
        uses: actions/deploy-pages@v4
