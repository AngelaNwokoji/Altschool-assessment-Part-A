<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirrored AltSchool Form</title>
  </head>
  <body>
    <header id="header">
      <h1>Application Form</h1>
      <p>Fill in your details below.</p>

      <nav aria-label="global navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html" aria-current="page">Application Form</a></li>
        </ul>
      </nav>
    </header>
    <main>

      <div role="group" aria-label="Account actions">
      <button type="button">Sign Up</button>
      <button type="button">Sign In</button>
      </div>


      <form action="#" method="post">
        <p>
            <label for="email-address">Email Address</label>
            <br />
            <input type="email" id="email-address" name="email-address" required />
          </p>

        <p>
            <label for="password">Password</label>
            <br />
            <input type="password" id="password" name="password" required minlength="8"/>
          </p>

       <button type="submit">Proceed to Dashboard</button>
       </form>

       <p>Don't have an account? <a href="#">Sign Up</a></p>
       <p>--------- OR ---------</p>
       <button type="button">Login with Google</button>

    </main>

    <footer>
      <address>
        28, Lawal Adenrele Street, Ijegun,
        <br />
        Lagos, Nigeria
      </address>

      <p>&copy; 2026 All Rights Reserved</p>

    </footer>
  </body>
</html>
